name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, DAO and Compose UI tests (Robolectric)
        run: ./gradlew --no-daemon :core:notion:test :core:data:testDebugUnitTest :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug :core:data:lintDebug
      - name: Screenshots (Roborazzi)
        run: ./gradlew --no-daemon :app:recordRoborazziDebug
      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkos-m1
          path: |
            app/build/outputs/apk/debug/*.apk
            docs/screenshots/m1/*.png
            **/build/reports/**
