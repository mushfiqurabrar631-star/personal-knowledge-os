name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Free GitHub-hosted runners only (public repository). No paid service, no secret is required for any job.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Final Testing records are valid (no PASS without evidence)
        run: python3 scripts/testplan.py check

      - name: No signing keys or secrets in the repository
        run: ./scripts/secret-scan.sh

      # Unit, DAO (incl. Room migration v1→v7), Notion/Drive engine and Compose UI tests (Robolectric).
      - name: Tests
        run: ./gradlew --no-daemon --continue :core:notion:test :core:data:testDebugUnitTest :app:testDebugUnitTest

      - name: Lint
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:lintDebug :core:data:lintDebug

      # Records PNGs into docs/screenshots/m1..m7 on the runner (CI never commits them).
      - name: Screenshots (Roborazzi)
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:recordRoborazziDebug

      # Debug is signed with the standard Android debug key on CI (the owner's local key is never in the repo).
      # Release is R8-shrunk and built UNSIGNED here: no signing key or password is stored in GitHub by default.
      - name: Debug, release and R8-check APKs (per-ABI + universal)
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:assembleR8check :app:assembleDebugAndroidTest

      # The app bundle cannot be built in the same Gradle run as ABI-split APKs (see app/build.gradle.kts).
      - name: Release app bundle (unsigned)
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Upload debug APKs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pkos-${{ github.run_number }}-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APKs and AAB (unsigned) + R8 mapping
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pkos-${{ github.run_number }}-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Upload instrumentation inputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pkos-${{ github.run_number }}-instrumentation-apks
          path: |
            app/build/outputs/apk/r8check/app-x86_64-r8check.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pkos-${{ github.run_number }}-screenshots
          path: docs/screenshots/**/*.png
          if-no-files-found: warn

      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkos-${{ github.run_number }}-test-and-lint-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          if-no-files-found: warn

  # Emulator checks that Robolectric cannot do: real Keystore, real SQLite, Tesseract native code, app launch,
  # and a launch + monkey run of the R8-shrunk build. An emulator is not the owner's phone: Final Testing still applies.
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleR8check

      - name: Instrumentation tests and R8 smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            n=$(find app/build/outputs/androidTest-results -name '*.xml' -exec grep -o '<testcase ' {} + < /dev/null | wc -l); echo "instrumentation test cases run: $n"; [ "$n" -ge 4 ] || { echo "expected at least 4 device tests"; exit 1; }
            adb install -r app/build/outputs/apk/r8check/app-x86_64-r8check.apk
            adb logcat -c
            adb shell am start -W -n com.pkos.app.r8check/com.pkos.app.MainActivity
            sleep 15
            adb shell monkey -p com.pkos.app.r8check --throttle 300 --pct-syskeys 0 -s 42 -v 300 || true
            sleep 5
            adb logcat -d > r8check-logcat.txt
            if grep -q "FATAL EXCEPTION" r8check-logcat.txt; then echo "R8 build crashed"; grep -A30 "FATAL EXCEPTION" r8check-logcat.txt | head -80; exit 1; fi
            echo "R8 build launched and survived monkey without a crash"

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkos-${{ github.run_number }}-instrumentation-reports
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            r8check-logcat.txt
          if-no-files-found: warn
