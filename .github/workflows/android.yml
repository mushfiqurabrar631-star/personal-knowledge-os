name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # Unit, DAO (incl. Room migration v1→v6), Notion/Drive engine and Compose UI tests (Robolectric).
      - name: Tests
        run: ./gradlew --no-daemon --continue :core:notion:test :core:data:testDebugUnitTest :app:testDebugUnitTest

      - name: Lint
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:lintDebug :core:data:lintDebug

      # Records PNGs into docs/screenshots/m1..m6 on the runner (CI never commits them).
      - name: Screenshots (Roborazzi)
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:recordRoborazziDebug

      # Debug is signed with the standard Android debug key on CI (the owner's local key is never in the repo).
      # Release is built unsigned: no signing key or secret is stored in GitHub.
      - name: Debug and release APKs
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pkos-${{ github.run_number }}-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK (unsigned)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pkos-${{ github.run_number }}-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pkos-${{ github.run_number }}-screenshots
          path: docs/screenshots/**/*.png
          if-no-files-found: warn

      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkos-${{ github.run_number }}-test-and-lint-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          if-no-files-found: warn
